<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Carrito</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .item-carrito { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #eee; margin-bottom: 8px; border-radius: 8px; transition: transform 0.2s; }
        .item-carrito:hover { transform: translateX(5px); background-color: #fcfcfc; }
        .info-producto { display: flex; align-items: center; gap: 15px; }
        .img-carrito { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
        .btn-quitar { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-quitar:hover { background: #c0392b; }
        .acciones-carrito { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
    </style>
</head>
<body>
<header class="navbar">
    <h1 class="logo" onclick="location.href='index.html'" style="cursor:pointer">Supermercado Ksax</h1>
    <div id="nav-auth-buttons" class="nav-buttons"></div>
</header>

<main class="form-container" style="max-width: 850px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Tu Cesta</h2>
        <button onclick="location.href='index.html'" style="background-color: #95a5a6;">← Volver a la Tienda</button>
    </div>
    <div id="lista-carrito"></div>
    <hr style="margin: 20px 0;">
    <div class="acciones-carrito">
        <div class="total-info">
            <h3 style="margin: 0;">Total a pagar: <span id="precio-total" style="color: #27ae60;">0</span>€</h3>
        </div>
        <button id="btn-comprar" onclick="finalizarCompra()" style="padding: 12px 30px; background-color: #27ae60; font-size: 1rem;">
            Confirmar y Pagar
        </button>
    </div>
</main>

<footer class="footer-simple">
    <p>© 2026 E-commerce San Andrés - Proyecto TFG</p>
</footer>

<script src="js/app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        verificarSesion();
        actualizarContadorCarrito();
        mostrarCarrito();
    });

    async function mostrarCarrito() {
        const ids = JSON.parse(localStorage.getItem('carrito')) || [];
        const contenedor = document.getElementById('lista-carrito');
        const totalTxt = document.getElementById('precio-total');

        if (ids.length === 0) {
            contenedor.innerHTML = "<div style='text-align:center; padding:40px;'><p>Tu cesta está vacía.</p><br><button onclick='location.href=\"index.html\"'>Ir a comprar algo</button></div>";
            totalTxt.innerText = "0";
            document.getElementById('btn-comprar').style.display = 'none';
            return;
        }

        try {
            const res = await fetch('/api/productos');
            const productosBD = await res.json();
            let html = "";
            let total = 0;

            ids.forEach((id, index) => {
                const p = productosBD.find(prod => prod.id == id);
                if (p) {
                    const img = p.imagenUrl ? p.imagenUrl : 'https://via.placeholder.com/60?text=Prod';
                    html += `
                        <div class="item-carrito">
                            <div class="info-producto">
                                <img src="${img}" class="img-carrito">
                                <div>
                                    <strong style="display:block;">${p.nombre}</strong>
                                    <small style="color:#888;">Categoría: ${p.categoria}</small>
                                </div>
                            </div>
                            <div style="display:flex; align-items:center; gap:20px;">
                                <span style="font-weight:bold; font-size:1.1rem;">${p.precio}€</span>
                                <button class="btn-quitar" onclick="eliminarDelCarrito(${index})">Eliminar</button>
                            </div>
                        </div>
                    `;
                    total += p.precio;
                }
            });
            contenedor.innerHTML = html;
            totalTxt.innerText = total.toFixed(2);
            document.getElementById('btn-comprar').style.display = 'block';
        } catch (e) {
            contenedor.innerHTML = "<p>Error al cargar los productos.</p>";
        }
    }

    function eliminarDelCarrito(index) {
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        carrito.splice(index, 1);
        localStorage.setItem('carrito', JSON.stringify(carrito));
        mostrarCarrito();
        actualizarContadorCarrito();
    }

    async function finalizarCompra() {
        const usuario = JSON.parse(sessionStorage.getItem('usuarioLogueado'));
        if (!usuario) {
            Swal.fire({
                icon: 'warning',
                title: 'Inicia sesión',
                text: 'Debes iniciar sesión para finalizar el pedido',
                confirmButtonColor: '#3498db',
                confirmButtonText: 'Ir a Login'
            }).then(() => {
                window.location.href = 'login.html';
            });
            return;
        }

        const ids = JSON.parse(localStorage.getItem('carrito')) || [];
        if (ids.length === 0) return;
        const total = parseFloat(document.getElementById('precio-total').innerText);

        const resPedido = await fetch('/api/pedidos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                usuarioId: usuario.id,
                productosIds: ids,
                total: total
            })
        });

        if (resPedido.ok) {
            for (const id of ids) {
                await fetch(`/api/productos/${id}/comprar`, { method: 'POST' });
            }

            Swal.fire({
                icon: 'success',
                title: '¡Pedido realizado!',
                text: 'Tu compra se ha procesado correctamente. ¡Gracias por confiar en nosotros!',
                confirmButtonColor: '#27ae60'
            }).then(() => {
                localStorage.removeItem('carrito');
                window.location.href = 'index.html';
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Hubo un error al procesar el pedido en el servidor.',
                confirmButtonColor: '#e74c3c'
            });
        }
    }
</script>
</body>
</html>
