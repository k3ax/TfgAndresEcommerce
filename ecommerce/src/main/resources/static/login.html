<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - San Andrés</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="navbar">
    <h1 class="logo" onclick="location.href='index.html'" style="cursor:pointer">San Andrés</h1>
    <button onclick="location.href='index.html'">Volver a la Tienda</button>
</header>

<div class="form-container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Nombre de usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
    </form>
    <p style="margin-top: 20px;">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
</div>


<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;

        // Enviamos la petición como JSON para que el Backend (UsuarioController) lo reconozca
        const res = await fetch('/api/usuarios/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: u,
                password: p
            })
        });

        if (res.ok) {
            const user = await res.json();
            sessionStorage.setItem('usuarioLogueado', JSON.stringify(user));
            alert("Bienvenido, " + user.username);
            window.location.href = 'index.html';
        } else {
            alert("Usuario o contraseña incorrectos");
        }
    });
</script>
</body>
</html>
