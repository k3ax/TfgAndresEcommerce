<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Supermercado Ksax</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<header class="navbar">
    <h1 class="logo" onclick="location.href='index.html'" style="cursor:pointer">San Andrés</h1>
    <button onclick="location.href='index.html'">Volver a la Tienda</button>
</header>

<div class="form-container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Nombre de usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
    </form>
    <p style="margin-top: 20px;">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;

        const res = await fetch('/api/usuarios/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: u,
                password: p
            })
        });

        if (res.ok) {
            const user = await res.json();
            sessionStorage.setItem('usuarioLogueado', JSON.stringify(user));

            Swal.fire({
                icon: 'success',
                title: '¡Bienvenido!',
                text: `Hola de nuevo, ${user.username}`,
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                window.location.href = 'index.html';
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Acceso denegado',
                text: 'Usuario o contraseña incorrectos',
                confirmButtonColor: '#3498db'
            });
        }
    });
</script>
</body>
</html>
