<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - San Andrés</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="form-container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Nombre de usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
    </form>
    <p style="margin-top: 20px;">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;

        const res = await fetch(`/api/usuarios/login?username=${u}&password=${p}`);
        if (res.ok) {
            const user = await res.json();
            sessionStorage.setItem('usuarioLogueado', JSON.stringify(user));
            alert("Bienvenido, " + user.username);
            window.location.href = 'index.html';
        } else {
            alert("Usuario o contraseña incorrectos");
        }
    });
</script>
</body>
</html>
