<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Supermercado Ksax</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="form-container">
    <h2>Registro de Usuario</h2>
    <form id="registroForm">
        <input type="text" id="reg-username" placeholder="Nombre de usuario" required>
        <input type="email" id="reg-email" placeholder="Correo electrónico" required>
        <input type="password" id="reg-password" placeholder="Contraseña" required>
        <button type="submit">Crear cuenta</button>
    </form>
    <p style="margin-top: 20px;">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
</div>

<script>
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nuevoUser = {
            username: document.getElementById('reg-username').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value,
            rol: 'USER_BASIC'
        };

        const res = await fetch('/api/usuarios/registro', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(nuevoUser)
        });

        if (res.ok) {
            Swal.fire({
                icon: 'success',
                title: '¡Cuenta creada!',
                text: 'Registro completado con éxito. Ya puedes iniciar sesión.',
                confirmButtonColor: '#27ae60'
            }).then(() => {
                window.location.href = 'login.html';
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Error en el registro',
                text: 'Ese nombre de usuario o correo ya está en uso.',
                confirmButtonColor: '#e74c3c'
            });
        }
    });
</script>
</body>
</html>
